[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-engine",
    "crates/sim-ingest",
    "crates/sim-ipc",
    "crates/sim-cli",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
